<div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
<aside class="dashboard-sidebar staff-sidebar" id="dashboard-sidebar">
    <div class="staff-sidebar-heading"><span class="staff-brand-mark" aria-hidden="true">UT</span><span>{{ app_name or 'UrTax' }}</span></div>
    <nav class="sidebar-nav" aria-label="Staff navigation">
        <a class="sidebar-nav-item{% if active_nav == 'dashboard' %} active{% endif %}" href="/staff/dashboard">
            <span class="sidebar-nav-icon" aria-hidden="true">&#9635;</span> Dashboard
        </a>
        
        <!-- Collapsible / Expandable Cases Dropdown -->
        <div class="sidebar-dropdown-wrap">
            <button 
                type="button" 
                class="sidebar-nav-item sidebar-dropdown-toggle{% if active_nav in ['my_cases', 'all_cases', 'cases'] %} active{% endif %}" 
                id="cases-dropdown-btn"
                aria-expanded="{% if active_nav in ['my_cases', 'all_cases', 'cases'] %}true{% else %}false{% endif %}"
                style="width: 100%; display: flex; align-items: center; justify-content: space-between; background: transparent; border: 0; cursor: pointer; color: inherit; font: inherit; padding: 0.75rem 1rem;"
            >
                <span style="display: flex; align-items: center; gap: 0.6rem;">
                    <span class="sidebar-nav-icon" aria-hidden="true">&#128194;</span> Cases
                </span>
                <span class="dropdown-chevron" style="transition: transform 0.2s ease; font-size: 0.75rem;">&#9660;</span>
            </button>
            <div 
                class="sidebar-dropdown-menu" 
                id="cases-dropdown-menu" 
                {% if active_nav not in ['my_cases', 'all_cases', 'cases'] %}hidden style="display: none; padding-left: 1.5rem; flex-direction: column; gap: 0.25rem; margin-top: 0.25rem;"{% else %}style="display: flex; padding-left: 1.5rem; flex-direction: column; gap: 0.25rem; margin-top: 0.25rem;"{% endif %}
            >
                <a class="sidebar-nav-item sidebar-nav-item--nested{% if active_nav == 'my_cases' %} active{% endif %}" href="/staff/cases/my">
                    My Cases
                </a>
                <a class="sidebar-nav-item sidebar-nav-item--nested{% if active_nav == 'all_cases' %} active{% endif %}" href="/staff/cases">
                    All Cases
                </a>
            </div>
        </div>

        <a class="sidebar-nav-item{% if active_nav == 'clients' %} active{% endif %}" href="/staff/clients">
            <span class="sidebar-nav-icon" aria-hidden="true">&#128101;</span> Clients
        </a>
        <a class="sidebar-nav-item{% if active_nav == 'notifications' %} active{% endif %}" href="/staff/notifications">
            <span class="sidebar-nav-icon" aria-hidden="true">&#128276;</span> Notifications
        </a>
    </nav>
    <div class="sidebar-footer">
        <a class="sidebar-nav-item{% if active_nav == 'profile' %} active{% endif %}" href="/staff/profile">
            <span class="sidebar-nav-icon" aria-hidden="true">&#128100;</span> Profile
        </a>
        <form action="/auth/logout" method="post">
            <button type="submit" class="sidebar-nav-item sidebar-nav-item--logout">
                <span class="sidebar-nav-icon" aria-hidden="true">&#8630;</span> Logout
            </button>
        </form>
    </div>
</aside>

<script>
(function() {
    function initDropdown() {
        const casesBtn = document.getElementById("cases-dropdown-btn");
        const casesMenu = document.getElementById("cases-dropdown-menu");

        if (casesBtn && casesMenu) {
            // Set initial chevron rotation based on initial expanded state
            const initialExpanded = casesBtn.getAttribute("aria-expanded") === "true";
            const chevron = casesBtn.querySelector(".dropdown-chevron");
            if (chevron) {
                chevron.style.transform = initialExpanded ? "rotate(180deg)" : "rotate(0deg)";
            }

            casesBtn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                const isCurrentlyExpanded = casesBtn.getAttribute("aria-expanded") === "true";
                const newExpandedState = !isCurrentlyExpanded;

                casesBtn.setAttribute("aria-expanded", String(newExpandedState));
                if (newExpandedState) {
                    casesMenu.removeAttribute("hidden");
                    casesMenu.style.display = "flex";
                } else {
                    casesMenu.setAttribute("hidden", "");
                    casesMenu.style.display = "none";
                }

                if (chevron) {
                    chevron.style.transform = newExpandedState ? "rotate(180deg)" : "rotate(0deg)";
                }
            });
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initDropdown);
    } else {
        initDropdown();
    }
})();
</script>
