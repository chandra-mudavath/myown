{# Shared light/dark theme toggle. Behaviour lives in static/js/main.js.
   Pass `toggle_class` (e.g. "auth-theme-toggle") for page-specific positioning. #}
<button id="theme-toggle" class="theme-toggle{% if toggle_class %} {{ toggle_class }}{% endif %}" type="button"
    aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"></path>
    </svg>
    <span class="sr-only">Switch theme</span>
</button>
