{#- Small line icons for the auth forms: {% from "auth/_icons.html" import icon %} then {{ icon("mail") }}. -#}
{% macro icon(name, cls="au-input__icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true">
    {%- if name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3.5 6.5 8.5 6 8.5-6" />
    {%- elif name == "key" %}<circle cx="8" cy="15" r="4" /><path d="m10.8 12.2 8.7-8.7M16 7l2.5 2.5M18.5 4.5 21 7" />
    {%- elif name == "lock" %}<rect x="4.5" y="10.5" width="15" height="10" rx="2" /><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
    {%- elif name == "user" %}<circle cx="12" cy="8" r="4" /><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
    {%- elif name == "sign-in" %}<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l4-4-4-4M14 12H3" />
    {%- elif name == "send" %}<path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7Z" />
    {%- elif name == "refresh" %}<path d="M20 11a8 8 0 0 0-14.9-3.5M4 4v4h4M4 13a8 8 0 0 0 14.9 3.5M20 20v-4h-4" />
    {%- endif %}
</svg>
{%- endmacro %}
