{% extends "base.html" %}
{% block title %}Admin Modal Forms - {{ app_name }}{% endblock %}

{% block content %}
<!-- Modal Overlay Backdrop -->
<div id="admin-modal-overlay" class="modal-overlay" hidden>
    <div class="modal-box" id="admin-modal-box">
        <div class="modal-header">
            <h3 id="modal-title">Form Title</h3>
            <button type="button" class="modal-close-btn" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Form content will be injected or toggled here -->
        </div>
    </div>
</div>

<style>
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    padding: 1rem;
}
.modal-overlay[hidden] { display: none !important; }
.modal-box {
    background: var(--bg-card, #ffffff);
    border: 1px solid var(--line, #e2e8f0);
    border-radius: 16px;
    width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2), 0 8px 10px -6px rgba(0,0,0,0.1);
}
.modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--line, #e2e8f0);
}
.modal-header h3 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--ink-primary, #0f172a); }
.modal-close-btn {
    background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--ink-secondary, #64748b);
    line-height: 1; padding: 0.25rem;
}
.modal-body { padding: 1.5rem; }
.modal-form-group { margin-bottom: 1.1rem; }
.modal-form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--ink-primary, #0f172a); }
.modal-form-group input, .modal-form-group select {
    width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px;
    border: 1px solid var(--line, #cbd5e1); font-size: 0.9rem;
    background: var(--bg-surface, #f8fafc); color: var(--ink-primary, #0f172a);
}
.modal-form-group input:focus, .modal-form-group select:focus {
    outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.modal-btn-submit {
    width: 100%; padding: 0.75rem; border-radius: 8px; border: none;
    background: #2563eb; color: white; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: background 0.2s;
}
.modal-btn-submit:hover { background: #1d4ed8; }
.success-credentials-box {
    background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
    padding: 1.25rem; text-align: center; color: #166534;
}
.success-credentials-box p { margin: 0.3rem 0; font-size: 0.9rem; }
.cred-highlight { font-family: monospace; font-size: 1.1rem; font-weight: 700; background: #dcfce7; padding: 0.25rem 0.5rem; border-radius: 4px; }
</style>
{% endblock %}
