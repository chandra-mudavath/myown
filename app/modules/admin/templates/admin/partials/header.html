{#- Admin page header: breadcrumb, account menu and theme toggle. Set `crumb` in the page ("Clients", "Cases / FLI_…"). -#}
<header class="admin-header">
    <div class="admin-header-brand">
        <span class="admin-mark">UT</span>
        <span>{{ app_name }} / Admin{% if crumb %} / {{ crumb }}{% endif %}</span>
    </div>
    <div class="admin-header-actions">
        <div class="account-menu-wrap">
            <button class="account-menu-button admin-avatar-btn" type="button" aria-expanded="false" aria-label="Open admin menu">
                {% if admin and admin.profile_picture %}
                <img src="{{ admin.profile_picture }}" alt="Admin Avatar" class="admin-header-avatar-img" />
                {% else %}
                <span class="admin-avatar" title="{{ admin_name }} {{ admin_last_name }}">{{ initials }}</span>
                {% endif %}
            </button>
            <div class="account-menu admin-account-menu" hidden>
                {% if admin and admin.profile_picture %}
                <a class="account-menu-action" href="javascript:void(0)" onclick="openAvatarModal('{{ admin.profile_picture }}')" title="View Profile Picture"><span aria-hidden="true">&#128065;</span> View</a>
                {% endif %}
                <label class="account-menu-action" onclick="document.getElementById('admin-avatar-input').click()" title="Edit Profile Picture"><span aria-hidden="true">&#9998;</span> Edit</label>
            </div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"></path></svg>
            <span class="sr-only">Switch theme</span>
        </button>
    </div>
</header>
