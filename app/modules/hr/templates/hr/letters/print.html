<!doctype html>
{#- A document on its own page, ready for Print / Save as PDF; also the page the PDF download is made from.
    Used by HR, staff and admin. -#}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ doc.document_number }} · {{ title }}</title>
    <style>
        body { margin: 0; background: #eef0f3; font-family: Arial, sans-serif; }
        .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 792px; margin: 0 auto; padding: 14px 16px; }
        .bar a, .bar button { font: inherit; font-weight: 700; border-radius: 6px; padding: 8px 14px; cursor: pointer; text-decoration: none; }
        .bar a { color: #1d4ed8; background: #fff; border: 1px solid #e5e7eb; }
        .bar button { color: #fff; background: #2563eb; border: 0; }
        .sheet { max-width: 792px; margin: 0 auto 32px; box-shadow: 0 10px 28px -18px rgba(15, 23, 42, .5); }
        @media print {
            body { background: #fff; }
            .bar { display: none; }
            .sheet { box-shadow: none; margin: 0; max-width: none; }
            .hr-letter { overflow: visible !important; padding: 0 !important; }  /* the @page margin is the margin */
            /* the watermark once in the middle of every printed page (and every PDF page) */
            .hr-wm { position: fixed !important; background-repeat: no-repeat !important; background-position: center !important;
                     background-size: contain !important; }
            .hr-letter, .hr-wm { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { size: A4; margin: 10mm 12mm; }
        }
    </style>
</head>
<body>
    <div class="bar">
        <a href="javascript:history.back()">&#8249; Back</a>
        <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
    <div class="sheet">{{ letter | safe }}</div>
</body>
</html>
