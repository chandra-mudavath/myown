{#- Inline SVG icons for the error screens: no network request, so they also work on the static nginx pages. -#}
{% macro error_icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "lock" %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.2"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "userx" %}<circle cx="10" cy="8" r="4"/><path d="M3 21c0-3.9 3.1-7 7-7 1.4 0 2.6.4 3.7 1"/><path d="m16 16 5 5m0-5-5 5"/>
{%- elif name == "shield" %}<path d="M12 3 4 6v6c0 4.6 3.4 8.4 8 9 4.6-.6 8-4.4 8-9V6z"/><path d="M9.5 9.5l5 5m0-5-5 5"/>
{%- elif name == "compass" %}<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>
{%- elif name == "filesearch" %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M14 3v5h5"/><path d="M19 8v3"/><circle cx="16.5" cy="16.5" r="3"/><path d="m21 21-2.3-2.3"/>
{%- elif name == "filex" %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m10 12 4 4m0-4-4 4"/>
{%- elif name == "link" %}<path d="M9 15 7.5 16.5a3.5 3.5 0 0 1-5-5L5 9"/><path d="M15 9l1.5-1.5a3.5 3.5 0 0 1 5 5L19 15"/><path d="M8 4v2M4 8h2M16 20v-2M20 16h-2"/>
{%- elif name == "refresh" %}<path d="M20 11a8 8 0 0 0-14.7-4.3L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.7 4.3L20 16"/><path d="M20 21v-5h-5"/>
{%- elif name == "form" %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
{%- elif name == "upload" %}<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/>
{%- elif name == "server" %}<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>
{%- elif name == "hourglass" %}<path d="M6 3h12M6 21h12"/><path d="M7 3v2a5 5 0 0 0 10 0V3"/><path d="M7 21v-2a5 5 0 0 1 10 0v2"/>
{%- elif name == "wrench" %}<path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2 2 0 0 1-2.8-2.8z"/><path d="M14.7 6.3 17 4l3 3-2.3 2.3"/>
{%- else %}<path d="M12 3 2 20h20z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.8"/>
{%- endif %}
</svg>
{%- endmacro %}
